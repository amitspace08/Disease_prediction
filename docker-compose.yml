version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - healthai-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - JWT_SECRET=super_secret_key_change_in_production
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - healthai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - healthai-network

volumes:
  mongodb_data:

networks:
  healthai-network:
    driver: bridge
